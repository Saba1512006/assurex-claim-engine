{% extends "components/base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="denied">
  <div>
    <span class="code">ERROR {{ code }}</span>
    <h1>{{ title }}</h1>
    <p class="muted mt-1">{{ message }}</p>
    <div class="row mt-3" style="justify-content:center">
      <a class="btn" href="{{ url_for('auth.home') if current_user else url_for('public.index') }}">{{ 'Go to my dashboard' if current_user else 'Back to the home page' }}</a>
      <button class="btn quiet" type="button" data-history-back>Go back</button>
    </div>
  </div>
</section>
{% endblock %}
